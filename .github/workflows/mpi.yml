name: Test package with MPI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-code:
    name: Test on with MPI
    runs-on: ubuntu-24.04
    container:  ghcr.io/fenics/dolfinx/dolfinx:stable
    env:
      DEB_PYTHON_INSTALL_LAYOUT: deb_system

    steps:
      - uses: actions/checkout@v7

      - name: Install scifem-build dependencies
        run: python3 -m pip install --group build-scifem

      - name: Install h5py with MPI support
        run: HDF5_MPI=ON HDF5_PKGCONFIG_NAME="hdf5" python3 -m pip install h5py --no-build-isolation --no-binary=h5py

      - name: Install package
        run: python3 -m pip install .[test]

      - name: Run tests wit numba disabled
        run: mpirun -n 2 python3 -m pytest -v
